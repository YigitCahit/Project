<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Multiple universe bubbles -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="50" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="200" cy="80" r="60" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="300" cy="110" r="45" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="150" cy="170" r="40" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <circle cx="260" cy="180" r="55" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <!-- Stars in each universe -->
  <g fill="#fafafa" opacity="0.5">
    <!-- Universe 1 -->
    <circle cx="85" cy="90" r="1"/>
    <circle cx="110" cy="105" r="1.5"/>
    <circle cx="95" cy="115" r="1"/>
    <!-- Universe 2 -->
    <circle cx="180" cy="70" r="1.5"/>
    <circle cx="210" cy="85" r="1"/>
    <circle cx="195" cy="95" r="1"/>
    <!-- Universe 3 -->
    <circle cx="290" cy="100" r="1"/>
    <circle cx="310" cy="115" r="1.5"/>
    <circle cx="295" cy="125" r="1"/>
  </g>
  <!-- Connection/branching lines -->
  <g stroke="#c084fc" stroke-width="0.5" opacity="0.3">
    <path d="M150 100 Q175 90 200 80" fill="none"/>
    <path d="M200 140 Q230 150 260 180" fill="none"/>
    <path d="M100 150 Q125 160 150 170" fill="none"/>
  </g>
  <!-- Infinity symbol -->
  <text x="200" y="130" text-anchor="middle" fill="#8b5cf6" font-size="24" opacity="0.4">∞</text>
  <!-- Label -->
  <text x="200" y="235" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="11">Multiverse Theory</text>
  <!-- Central glow -->
  <circle cx="200" cy="125" r="100" fill="#8b5cf6" opacity="0.05" filter="blur(50px)"/>
</svg>