<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Asteroid -->
  <ellipse cx="200" cy="120" rx="70" ry="50" fill="#27272a"/>
  <ellipse cx="180" cy="100" rx="15" ry="10" fill="#1a1a1d"/>
  <ellipse cx="230" cy="130" rx="20" ry="12" fill="#1a1a1d"/>
  <ellipse cx="195" cy="145" rx="10" ry="8" fill="#1a1a1d"/>
  <!-- Mining spacecraft -->
  <g transform="translate(280, 90)">
    <rect x="0" y="10" width="40" height="20" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="40" y="15" width="15" height="10" fill="#8b5cf6"/>
    <!-- Mining arm -->
    <line x1="0" y1="20" x2="-25" y2="35" stroke="#c084fc" stroke-width="2"/>
    <circle cx="-25" cy="35" r="5" fill="#c084fc"/>
    <!-- Thrusters -->
    <rect x="42" y="12" width="8" height="4" fill="#fef08a" opacity="0.6"/>
    <rect x="42" y="24" width="8" height="4" fill="#fef08a" opacity="0.6"/>
  </g>
  <!-- Precious metals indicators -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="170" cy="115" r="4"/>
    <circle cx="210" cy="105" r="3"/>
    <circle cx="225" cy="125" r="4"/>
    <circle cx="185" cy="135" r="3"/>
  </g>
  <!-- Stars -->
  <g fill="#fafafa" opacity="0.3">
    <circle cx="50" cy="40" r="1"/>
    <circle cx="100" cy="60" r="1.5"/>
    <circle cx="350" cy="50" r="1"/>
    <circle cx="320" cy="180" r="1"/>
    <circle cx="60" cy="200" r="1"/>
  </g>
  <!-- Value indicator -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#1a1a1d" stroke="#fef08a" stroke-width="1" opacity="0.6"/>
    <text x="50" y="20" text-anchor="middle" fill="#fef08a" font-family="system-ui" font-size="11">$10 Trillion</text>
  </g>
  <!-- Label -->
  <text x="200" y="230" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="11">Asteroid Mining Operations</text>
  <!-- Glow -->
  <circle cx="200" cy="120" r="80" fill="#fef08a" opacity="0.03" filter="blur(30px)"/>
</svg>