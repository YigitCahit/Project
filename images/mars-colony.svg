<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Mars surface -->
  <rect x="0" y="180" width="400" height="70" fill="#1a1a1d"/>
  <ellipse cx="100" cy="180" rx="40" ry="10" fill="#27272a"/>
  <ellipse cx="300" cy="185" rx="50" ry="8" fill="#27272a"/>
  <!-- Dome structures -->
  <g>
    <!-- Main dome -->
    <ellipse cx="200" cy="180" rx="80" ry="15" fill="#27272a"/>
    <path d="M120 180 Q200 100 280 180" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M140 180 Q200 120 260 180" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <!-- Small dome -->
    <ellipse cx="320" cy="175" rx="30" ry="8" fill="#27272a"/>
    <path d="M290 175 Q320 140 350 175" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <!-- Connection tunnel -->
  <rect x="270" y="170" width="30" height="8" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1"/>
  <!-- Lights in dome -->
  <g fill="#c084fc" opacity="0.7">
    <circle cx="180" cy="155" r="3"/>
    <circle cx="200" cy="145" r="3"/>
    <circle cx="220" cy="155" r="3"/>
  </g>
  <!-- Mars sky/stars -->
  <g fill="#fafafa" opacity="0.3">
    <circle cx="50" cy="40" r="1"/>
    <circle cx="150" cy="30" r="1.5"/>
    <circle cx="280" cy="50" r="1"/>
    <circle cx="350" cy="35" r="1"/>
    <circle cx="100" cy="70" r="1"/>
  </g>
  <!-- Rocket -->
  <g transform="translate(60, 80)">
    <ellipse cx="15" cy="40" rx="8" ry="25" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1.5"/>
    <polygon points="15,10 8,35 22,35" fill="#8b5cf6"/>
    <rect x="5" y="55" width="6" height="10" fill="#c084fc" opacity="0.6"/>
    <rect x="19" y="55" width="6" height="10" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Label -->
  <text x="200" y="230" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="11">Mars Colony 2035</text>
  <!-- Red tint glow -->
  <circle cx="200" cy="200" r="150" fill="#ef4444" opacity="0.03" filter="blur(50px)"/>
</svg>