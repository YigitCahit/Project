<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#111113"/>
  <defs>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Brain outline -->
  <ellipse cx="150" cy="150" rx="80" ry="90" fill="none" stroke="url(#brain)" stroke-width="2" opacity="0.6"/>
  <!-- Neural network -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.5">
    <circle cx="120" cy="120" r="8" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="150" cy="100" r="8" fill="#8b5cf6" opacity="0.5"/>
    <circle cx="180" cy="130" r="8" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="130" cy="160" r="8" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="170" cy="170" r="8" fill="#8b5cf6" opacity="0.9"/>
    <circle cx="140" cy="200" r="8" fill="#8b5cf6" opacity="0.5"/>
    <line x1="120" y1="120" x2="150" y2="100"/>
    <line x1="150" y1="100" x2="180" y2="130"/>
    <line x1="120" y1="120" x2="130" y2="160"/>
    <line x1="180" y1="130" x2="170" y2="170"/>
    <line x1="130" y1="160" x2="170" y2="170"/>
    <line x1="130" y1="160" x2="140" y2="200"/>
    <line x1="170" y1="170" x2="140" y2="200"/>
  </g>
  <!-- AI circuit -->
  <g stroke="#c084fc" stroke-width="1.5">
    <rect x="260" y="100" width="100" height="100" rx="10" fill="#1a1a1d"/>
    <circle cx="280" cy="125" r="5" fill="#c084fc"/>
    <circle cx="310" cy="125" r="5" fill="#8b5cf6"/>
    <circle cx="340" cy="125" r="5" fill="#c084fc"/>
    <circle cx="280" cy="150" r="5" fill="#8b5cf6"/>
    <circle cx="310" cy="150" r="5" fill="#c084fc"/>
    <circle cx="340" cy="150" r="5" fill="#8b5cf6"/>
    <circle cx="280" cy="175" r="5" fill="#c084fc"/>
    <circle cx="310" cy="175" r="5" fill="#8b5cf6"/>
    <circle cx="340" cy="175" r="5" fill="#c084fc"/>
  </g>
  <!-- Connection -->
  <path d="M230 150 Q245 150 260 150" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <!-- Glow -->
  <circle cx="200" cy="150" r="80" fill="#8b5cf6" opacity="0.05" filter="blur(30px)"/>
  <text x="200" y="270" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="12">Consciousness ↔ Artificial Intelligence</text>
</svg>