<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Neural network layers -->
  <g stroke="#8b5cf6" stroke-width="1">
    <!-- Input layer -->
    <g fill="#8b5cf6" opacity="0.6">
      <circle cx="60" cy="60" r="8"/>
      <circle cx="60" cy="95" r="8"/>
      <circle cx="60" cy="130" r="8"/>
      <circle cx="60" cy="165" r="8"/>
      <circle cx="60" cy="200" r="8"/>
    </g>
    <!-- Hidden layer 1 -->
    <g fill="#c084fc" opacity="0.6">
      <circle cx="140" cy="75" r="8"/>
      <circle cx="140" cy="110" r="8"/>
      <circle cx="140" cy="145" r="8"/>
      <circle cx="140" cy="180" r="8"/>
    </g>
    <!-- Hidden layer 2 -->
    <g fill="#a78bfa" opacity="0.6">
      <circle cx="220" cy="90" r="8"/>
      <circle cx="220" cy="125" r="8"/>
      <circle cx="220" cy="160" r="8"/>
    </g>
    <!-- Output layer -->
    <g fill="#8b5cf6" opacity="0.8">
      <circle cx="300" cy="110" r="8"/>
      <circle cx="300" cy="145" r="8"/>
    </g>
  </g>
  <!-- Connections (simplified) -->
  <g stroke="#8b5cf6" stroke-width="0.5" opacity="0.3">
    <line x1="68" y1="60" x2="132" y2="75"/>
    <line x1="68" y1="95" x2="132" y2="110"/>
    <line x1="68" y1="130" x2="132" y2="145"/>
    <line x1="68" y1="165" x2="132" y2="180"/>
    <line x1="148" y1="75" x2="212" y2="90"/>
    <line x1="148" y1="110" x2="212" y2="125"/>
    <line x1="148" y1="145" x2="212" y2="160"/>
    <line x1="228" y1="90" x2="292" y2="110"/>
    <line x1="228" y1="125" x2="292" y2="145"/>
    <line x1="228" y1="160" x2="292" y2="145"/>
  </g>
  <!-- Text input visualization -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="60" height="50" rx="5" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1"/>
    <text x="30" y="20" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="8">Hello</text>
    <text x="30" y="32" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="8">World</text>
    <text x="30" y="44" text-anchor="middle" fill="#c084fc" font-family="system-ui" font-size="8">...</text>
  </g>
  <!-- Labels -->
  <text x="60" y="230" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="9">Input</text>
  <text x="180" y="230" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="9">Processing</text>
  <text x="300" y="230" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="9">Output</text>
  <!-- Parameter count -->
  <text x="200" y="25" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="10">175B Parameters</text>
  <!-- Glow -->
  <circle cx="200" cy="125" r="100" fill="#8b5cf6" opacity="0.05" filter="blur(40px)"/>
</svg>