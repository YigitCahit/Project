<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Brain silhouette -->
  <ellipse cx="200" cy="100" rx="70" ry="60" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Neural signals -->
  <g stroke="#c084fc" stroke-width="1.5" opacity="0.7">
    <path d="M160 80 Q180 70 200 80 Q220 90 240 80" fill="none"/>
    <path d="M150 100 Q175 90 200 100 Q225 110 250 100" fill="none"/>
    <path d="M160 120 Q180 130 200 120 Q220 110 240 120" fill="none"/>
  </g>
  <!-- Interface chip -->
  <rect x="180" y="160" width="40" height="20" rx="4" fill="#8b5cf6"/>
  <g fill="#0a0a0b">
    <circle cx="190" cy="170" r="3"/>
    <circle cx="200" cy="170" r="3"/>
    <circle cx="210" cy="170" r="3"/>
  </g>
  <!-- Connection wires -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.6">
    <line x1="190" y1="160" x2="180" y2="140"/>
    <line x1="200" y1="160" x2="200" y2="135"/>
    <line x1="210" y1="160" x2="220" y2="140"/>
  </g>
  <!-- Data stream -->
  <g fill="#c084fc" opacity="0.5">
    <circle cx="170" y1="200" r="2"/>
    <circle cx="185" cy="200" r="2"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="215" cy="200" r="2"/>
    <circle cx="230" cy="200" r="2"/>
  </g>
  <!-- Binary -->
  <text x="200" y="220" text-anchor="middle" fill="#52525b" font-family="monospace" font-size="8">01001110 01000101 01010101</text>
  <!-- Glow -->
  <circle cx="200" cy="120" r="80" fill="#8b5cf6" opacity="0.08" filter="blur(30px)"/>
</svg>