<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Telescope structure -->
  <g transform="translate(150, 60)">
    <!-- Primary mirror (hexagonal segments) -->
    <g fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1">
      <polygon points="50,0 75,15 75,45 50,60 25,45 25,15"/>
      <polygon points="85,15 110,30 110,60 85,75 60,60 60,30"/>
      <polygon points="15,15 40,30 40,60 15,75 -10,60 -10,30"/>
      <polygon points="50,60 75,75 75,105 50,120 25,105 25,75"/>
    </g>
    <!-- Sun shield -->
    <path d="M-30 130 L50 80 L130 130" fill="none" stroke="#c084fc" stroke-width="2"/>
    <path d="M-20 140 L50 95 L120 140" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
    <path d="M-10 150 L50 110 L110 150" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Deep space image (distant galaxies) -->
  <g opacity="0.5">
    <ellipse cx="60" cy="80" rx="15" ry="8" fill="#8b5cf6" transform="rotate(-30, 60, 80)"/>
    <ellipse cx="340" cy="60" rx="12" ry="6" fill="#c084fc" transform="rotate(20, 340, 60)"/>
    <circle cx="50" cy="150" r="5" fill="#a78bfa"/>
    <circle cx="360" cy="140" r="4" fill="#8b5cf6"/>
  </g>
  <!-- Stars -->
  <g fill="#fafafa" opacity="0.4">
    <circle cx="30" cy="40" r="1"/>
    <circle cx="100" cy="30" r="1.5"/>
    <circle cx="320" cy="25" r="1"/>
    <circle cx="370" cy="90" r="1"/>
    <circle cx="25" cy="120" r="1"/>
    <circle cx="380" cy="180" r="1.5"/>
  </g>
  <!-- Light rays from telescope -->
  <g stroke="#c084fc" stroke-width="0.5" opacity="0.3">
    <line x1="200" y1="60" x2="60" y2="80"/>
    <line x1="200" y1="60" x2="340" y2="60"/>
    <line x1="200" y1="60" x2="50" y2="150"/>
  </g>
  <!-- Label -->
  <text x="200" y="230" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="11">James Webb Space Telescope</text>
  <!-- Glow -->
  <circle cx="200" cy="100" r="60" fill="#8b5cf6" opacity="0.08" filter="blur(30px)"/>
</svg>