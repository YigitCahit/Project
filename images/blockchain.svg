<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Blockchain blocks -->
  <g>
    <rect x="30" y="90" width="70" height="70" rx="8" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="130" y="90" width="70" height="70" rx="8" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="230" y="90" width="70" height="70" rx="8" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="330" y="90" width="50" height="70" rx="8" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  <!-- Chain links -->
  <g stroke="#8b5cf6" stroke-width="2">
    <line x1="100" y1="125" x2="130" y2="125"/>
    <line x1="200" y1="125" x2="230" y2="125"/>
    <line x1="300" y1="125" x2="330" y2="125" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  <!-- Hash symbols -->
  <g fill="#71717a" font-family="monospace" font-size="8">
    <text x="45" y="115">#a7f3</text>
    <text x="45" y="130">→#b2e1</text>
    <text x="145" y="115">#b2e1</text>
    <text x="145" y="130">→#c4d2</text>
    <text x="245" y="115">#c4d2</text>
    <text x="245" y="130">→#d5f3</text>
  </g>
  <!-- Data icons -->
  <g fill="#8b5cf6" opacity="0.6">
    <rect x="50" y="140" width="30" height="4" rx="2"/>
    <rect x="50" y="148" width="20" height="4" rx="2"/>
    <rect x="150" y="140" width="30" height="4" rx="2"/>
    <rect x="150" y="148" width="20" height="4" rx="2"/>
    <rect x="250" y="140" width="30" height="4" rx="2"/>
    <rect x="250" y="148" width="20" height="4" rx="2"/>
  </g>
  <!-- Glow effect -->
  <circle cx="200" cy="125" r="100" fill="#8b5cf6" opacity="0.05" filter="blur(40px)"/>
  <text x="200" y="210" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="11">Distributed Ledger Technology</text>
</svg>