  <circle cx="155" cy="250" r="98" fill="#f97316" opacity="0.1" filter="url(#soft-glow)"/>
  <path d="M155 305C196 305 230 273 230 235C230 217 221 201 205 189C199 154 179 131 155 131C130 131 110 154 104 189C88 201 80 217 80 235C80 273 113 305 155 305Z" fill="url(#blast)"/>
  <path d="M155 188L143 220H166L151 260" stroke="#fff7ed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(460 72)">
    <rect x="0" y="0" width="286" height="252" rx="16" fill="#0b1222" stroke="#334155"/>
    <text x="20" y="34" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="700">7:10 KURALI</text>
    <text x="20" y="56" fill="#94a3b8" font-family="monospace" font-size="11">Sure 7 kat artarsa doz 10 kat duser</text>

    <line x1="28" y1="208" x2="256" y2="208" stroke="#475569" stroke-width="1.5"/>
    <line x1="28" y1="208" x2="28" y2="84" stroke="#475569" stroke-width="1.5"/>

    <path d="M36 96C84 126 122 149 160 170C194 188 218 198 248 203" stroke="url(#safe)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <circle cx="36" cy="96" r="4" fill="#22d3ee"/>
    <circle cx="104" cy="145" r="4" fill="#38bdf8"/>
    <circle cx="172" cy="179" r="4" fill="#60a5fa"/>
    <circle cx="248" cy="203" r="4" fill="#93c5fd"/>

    <text x="34" y="78" fill="#fca5a5" font-family="monospace" font-size="10">1s: 1000 R/s</text>
    <text x="90" y="136" fill="#fdba74" font-family="monospace" font-size="10">7s: 100 R/s</text>
    <text x="160" y="169" fill="#93c5fd" font-family="monospace" font-size="10">49s: 10 R/s</text>
    <text x="206" y="193" fill="#bfdbfe" font-family="monospace" font-size="10">343s: 1 R/s</text>

    <text x="18" y="226" fill="#94a3b8" font-family="monospace" font-size="10">Zaman</text>
    <text x="8" y="84" fill="#94a3b8" font-family="monospace" font-size="10" transform="rotate(-90 8 84)">Doz</text>
  </g>

  <g transform="translate(76 340)">
    <rect x="0" y="0" width="324" height="66" rx="10" fill="#0b1222" stroke="#334155"/>
    <text x="16" y="26" fill="#f8fafc" font-family="system-ui" font-size="18" font-weight="700">Nukleer Kisa Hazir misiniz?</text>
    <text x="16" y="47" fill="#94a3b8" font-family="monospace" font-size="11">Ilk 24-72 saat: iceri gir, iceride kal, bilgiyi radyodan takip et.</text>
  </g>

  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-family="system-ui" font-size="28" font-weight="700">2026'da Nukleer Kisa Hazir misiniz?</text>
  <text x="400" y="64" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">Hedeftaki Bolgeden Sag Cikmanin Matematiksel Formulu: 7:10</text>
