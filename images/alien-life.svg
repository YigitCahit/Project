<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Exoplanet -->
  <circle cx="200" cy="125" r="60" fill="#1a1a1d"/>
  <!-- Atmosphere layers -->
  <circle cx="200" cy="125" r="65" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="125" r="72" fill="none" stroke="#c084fc" stroke-width="0.5" opacity="0.2"/>
  <!-- Surface features (possible water/land) -->
  <g opacity="0.4">
    <ellipse cx="180" cy="110" rx="20" ry="15" fill="#8b5cf6"/>
    <ellipse cx="220" cy="140" rx="25" ry="12" fill="#8b5cf6"/>
    <ellipse cx="190" cy="145" rx="10" ry="8" fill="#c084fc"/>
  </g>
  <!-- Biosignature indicators -->
  <g stroke="#22c55e" stroke-width="2" opacity="0.6">
    <path d="M280 100 L300 100 L300 80" fill="none"/>
    <text x="305" y="95" fill="#22c55e" font-family="system-ui" font-size="10">O₂</text>
  </g>
  <g stroke="#3b82f6" stroke-width="2" opacity="0.6">
    <path d="M280 130 L300 130 L300 150" fill="none"/>
    <text x="305" y="140" fill="#3b82f6" font-family="system-ui" font-size="10">H₂O</text>
  </g>
  <!-- Star (host) -->
  <circle cx="50" cy="50" r="25" fill="#fef08a" opacity="0.3"/>
  <circle cx="50" cy="50" r="20" fill="#fef08a" opacity="0.5"/>
  <!-- Light from star -->
  <g stroke="#fef08a" stroke-width="0.5" opacity="0.2">
    <line x1="70" y1="60" x2="140" y2="100"/>
    <line x1="75" y1="55" x2="140" y2="90"/>
  </g>
  <!-- Habitable zone indicator -->
  <path d="M100 180 L300 180" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="200" y="195" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="9" opacity="0.7">Habitable Zone</text>
  <!-- Label -->
  <text x="200" y="235" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="11">Exoplanet Biosignature Search</text>
</svg>