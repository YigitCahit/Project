<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <defs>
    <linearGradient id="trap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="price-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="free-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="red-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background grid pattern -->
  <g stroke="#27272a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
  </g>
  
  <!-- Central cage/trap structure -->
  <g filter="url(#glow)">
    <!-- Cage bars -->
    <g stroke="url(#trap-grad)" stroke-width="2" opacity="0.8">
      <line x1="130" y1="50" x2="130" y2="200"/>
      <line x1="155" y1="50" x2="155" y2="200"/>
      <line x1="180" y1="50" x2="180" y2="200"/>
      <line x1="220" y1="50" x2="220" y2="200"/>
      <line x1="245" y1="50" x2="245" y2="200"/>
      <line x1="270" y1="50" x2="270" y2="200"/>
    </g>
    <!-- Cage top and bottom -->
    <rect x="120" y="45" width="160" height="10" rx="3" fill="#1a1a1d" stroke="url(#trap-grad)" stroke-width="1.5"/>
    <rect x="120" y="195" width="160" height="10" rx="3" fill="#1a1a1d" stroke="url(#trap-grad)" stroke-width="1.5"/>
  </g>
  
  <!-- User icon trapped inside -->
  <g transform="translate(200, 125)">
    <circle cx="0" cy="-15" r="12" fill="#3f3f46" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M-18 20 Q-18 0 0 0 Q18 0 18 20" fill="#3f3f46" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Chain on user -->
    <g stroke="#71717a" stroke-width="2" opacity="0.7">
      <circle cx="-25" cy="5" r="5" fill="none"/>
      <circle cx="-35" cy="5" r="5" fill="none"/>
      <circle cx="25" cy="5" r="5" fill="none"/>
      <circle cx="35" cy="5" r="5" fill="none"/>
    </g>
  </g>
  
  <!-- Data flow arrows going out -->
  <g stroke="#8b5cf6" stroke-width="1.5" opacity="0.5">
    <path d="M170 100 L100 70" marker-end="url(#arrow)"/>
    <path d="M230 100 L300 70" marker-end="url(#arrow)"/>
    <path d="M170 150 L100 180" marker-end="url(#arrow)"/>
    <path d="M230 150 L300 180" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Left side: "Free" period -->
  <g transform="translate(50, 60)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#1a1a1d" stroke="url(#free-grad)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">$0</text>
  </g>
  <text x="50" y="105" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="8">2024</text>
  
  <!-- Left bottom: Data extraction -->
  <g transform="translate(50, 175)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="8">DATA</text>
    <text x="0" y="10" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="6">RLHF</text>
  </g>
  
  <!-- Right side: Expensive future -->
  <g transform="translate(350, 60)" filter="url(#red-glow)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#1a1a1d" stroke="url(#price-grad)" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">$999</text>
  </g>
  <text x="350" y="105" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="8">2030</text>
  
  <!-- Right bottom: Lock-in -->
  <g transform="translate(350, 175)">
    <rect x="-30" y="-15" width="60" height="30" rx="5" fill="#1a1a1d" stroke="#ef4444" stroke-width="1" opacity="0.8"/>
    <!-- Lock icon -->
    <rect x="-8" y="-5" width="16" height="12" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M-5 -5 L-5 -10 A5 5 0 0 1 5 -10 L5 -5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  
  <!-- Timeline arrow -->
  <g stroke="#52525b" stroke-width="1">
    <line x1="50" y1="220" x2="350" y2="220"/>
    <polygon points="350,216 360,220 350,224" fill="#52525b"/>
  </g>
  <text x="200" y="240" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="9">Zaman</text>
  
  <!-- Title labels -->
  <text x="50" y="30" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="9" opacity="0.8">Ücretsiz</text>
  <text x="200" y="30" text-anchor="middle" fill="#c084fc" font-family="system-ui" font-size="9" opacity="0.8">Bağımlılık</text>
  <text x="350" y="30" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="9" opacity="0.8">Fahiş Fiyat</text>
  
  <!-- Price increase indicator -->
  <g stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6">
    <path d="M80 70 Q200 40 320 70" fill="none"/>
  </g>
  
  <!-- Background glow effects -->
  <circle cx="50" cy="80" r="40" fill="#22c55e" opacity="0.05" filter="blur(20px)"/>
  <circle cx="200" cy="125" r="60" fill="#8b5cf6" opacity="0.08" filter="blur(30px)"/>
  <circle cx="350" cy="80" r="40" fill="#ef4444" opacity="0.08" filter="blur(20px)"/>
</svg>