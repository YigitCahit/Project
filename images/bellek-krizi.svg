<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <defs>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="hbm-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- Standard DRAM Chip (Left - Fading/Shrinking) -->
  <g opacity="0.5">
    <rect x="40" y="80" width="80" height="90" rx="5" fill="#1a1a1d" stroke="#52525b" stroke-width="1.5"/>
    <!-- DRAM pins -->
    <g fill="#52525b">
      <rect x="50" y="170" width="4" height="8"/>
      <rect x="60" y="170" width="4" height="8"/>
      <rect x="70" y="170" width="4" height="8"/>
      <rect x="80" y="170" width="4" height="8"/>
      <rect x="90" y="170" width="4" height="8"/>
      <rect x="100" y="170" width="4" height="8"/>
    </g>
    <!-- DRAM label -->
    <text x="80" y="130" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="10">DDR5</text>
    <!-- Declining arrow -->
    <path d="M80 60 L80 75 M75 70 L80 75 L85 70" stroke="#ef4444" stroke-width="2" fill="none"/>
    <text x="80" y="55" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="8">-20%</text>
  </g>
  
  <!-- HBM Stack (Center - Growing/Dominant) -->
  <g>
    <!-- HBM layers stacked -->
    <rect x="160" y="140" width="80" height="12" rx="2" fill="url(#hbm-grad)" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="160" y="125" width="80" height="12" rx="2" fill="url(#hbm-grad)" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="160" y="110" width="80" height="12" rx="2" fill="url(#hbm-grad)" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="160" y="95" width="80" height="12" rx="2" fill="url(#hbm-grad)" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="160" y="80" width="80" height="12" rx="2" fill="url(#hbm-grad)" stroke="#8b5cf6" stroke-width="1"/>
    <rect x="160" y="65" width="80" height="12" rx="2" fill="url(#hbm-grad)" stroke="#8b5cf6" stroke-width="1"/>
    
    <!-- TSV connections -->
    <g stroke="#c084fc" stroke-width="1" stroke-dasharray="2,2" opacity="0.7">
      <line x1="175" y1="65" x2="175" y2="152"/>
      <line x1="200" y1="65" x2="200" y2="152"/>
      <line x1="225" y1="65" x2="225" y2="152"/>
    </g>
    
    <!-- HBM base interposer -->
    <rect x="150" y="155" width="100" height="15" rx="3" fill="#1a1a1d" stroke="url(#chip-grad)" stroke-width="1.5"/>
    <text x="200" y="165" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="7">INTERPOSER</text>
    
    <!-- Growing arrow -->
    <path d="M200 45 L200 60 M195 50 L200 45 L205 50" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="200" y="40" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="8">HBM4</text>
  </g>
  
  <!-- Price Chart (Right) -->
  <g>
    <rect x="280" y="60" width="100" height="120" rx="5" fill="#1a1a1d" stroke="#27272a" stroke-width="1"/>
    <!-- Chart grid -->
    <g stroke="#27272a" stroke-width="0.5">
      <line x1="290" y1="80" x2="370" y2="80"/>
      <line x1="290" y1="100" x2="370" y2="100"/>
      <line x1="290" y1="120" x2="370" y2="120"/>
      <line x1="290" y1="140" x2="370" y2="140"/>
      <line x1="290" y1="160" x2="370" y2="160"/>
    </g>
    <!-- Price line going up -->
    <path d="M295 155 L310 148 L325 135 L340 115 L355 90 L365 75" 
          stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Arrow at end -->
    <circle cx="365" cy="75" r="4" fill="#ef4444"/>
    <!-- Labels -->
    <text x="330" y="75" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="8">+90%</text>
    <text x="330" y="190" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="8">DDR5 Fiyat</text>
  </g>
  
  <!-- Cannibalization arrow -->
  <g>
    <path d="M125 125 C140 125 145 125 155 125" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
      </marker>
    </defs>
  </g>
  
  <!-- Supply icons -->
  <g fill="#ef4444" opacity="0.6">
    <circle cx="55" y="200" r="3"/>
    <text x="65" y="203" fill="#71717a" font-family="system-ui" font-size="7">Arz Azalıyor</text>
  </g>
  <g fill="#22c55e" opacity="0.6">
    <circle cx="155" cy="200" r="3"/>
    <text x="165" y="203" fill="#71717a" font-family="system-ui" font-size="7">AI Talebi</text>
  </g>
  
  <!-- Glow effects -->
  <circle cx="200" cy="110" r="60" fill="#8b5cf6" opacity="0.1" filter="blur(25px)"/>
  
  <!-- Bottom text -->
  <text x="200" y="235" text-anchor="middle" fill="#52525b" font-family="system-ui" font-size="9">The Great Memory Shortage 2025-2028</text>
</svg>