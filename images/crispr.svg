<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- DNA Helix -->
  <g stroke="#8b5cf6" stroke-width="2" fill="none">
    <!-- Left strand -->
    <path d="M150 30 Q130 60 150 90 Q170 120 150 150 Q130 180 150 210" opacity="0.8"/>
    <!-- Right strand -->
    <path d="M180 30 Q200 60 180 90 Q160 120 180 150 Q200 180 180 210" opacity="0.8"/>
  </g>
  <!-- Base pairs -->
  <g stroke="#c084fc" stroke-width="1.5">
    <line x1="150" y1="45" x2="180" y2="45"/>
    <line x1="145" y1="75" x2="185" y2="75"/>
    <line x1="155" y1="105" x2="175" y2="105"/>
    <line x1="145" y1="135" x2="185" y2="135"/>
    <line x1="155" y1="165" x2="175" y2="165"/>
    <line x1="150" y1="195" x2="180" y2="195"/>
  </g>
  <!-- CRISPR scissors -->
  <g transform="translate(260, 100)">
    <path d="M0 0 L30 30 M30 0 L0 30" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  <!-- Cut indication -->
  <g stroke="#c084fc" stroke-width="1" opacity="0.6">
    <line x1="200" y1="105" x2="240" y2="105" stroke-dasharray="4,4"/>
    <polygon points="235,100 245,105 235,110" fill="#c084fc"/>
  </g>
  <!-- Labels -->
  <text x="165" y="235" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="10">DNA</text>
  <text x="275" y="150" text-anchor="middle" fill="#71717a" font-family="system-ui" font-size="10">CRISPR-Cas9</text>
  <!-- Glow -->
  <circle cx="165" cy="120" r="80" fill="#8b5cf6" opacity="0.06" filter="blur(30px)"/>
</svg>