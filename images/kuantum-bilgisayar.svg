<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#111113"/>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Quantum processor base -->
  <rect x="250" y="125" width="300" height="200" rx="20" fill="#1a1a1d" stroke="#27272a" stroke-width="2"/>
  <!-- Qubit grid -->
  <g fill="none" stroke="url(#glow)" stroke-width="1.5">
    <circle cx="320" cy="175" r="15" opacity="0.9"/>
    <circle cx="370" cy="175" r="15" opacity="0.7"/>
    <circle cx="420" cy="175" r="15" opacity="0.8"/>
    <circle cx="470" cy="175" r="15" opacity="0.6"/>
    <circle cx="320" cy="225" r="15" opacity="0.7"/>
    <circle cx="370" cy="225" r="15" opacity="0.9"/>
    <circle cx="420" cy="225" r="15" opacity="0.6"/>
    <circle cx="470" cy="225" r="15" opacity="0.8"/>
    <circle cx="320" cy="275" r="15" opacity="0.8"/>
    <circle cx="370" cy="275" r="15" opacity="0.6"/>
    <circle cx="420" cy="275" r="15" opacity="0.9"/>
    <circle cx="470" cy="275" r="15" opacity="0.7"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.5">
    <line x1="320" y1="175" x2="370" y2="175"/>
    <line x1="370" y1="175" x2="420" y2="175"/>
    <line x1="420" y1="175" x2="470" y2="175"/>
    <line x1="320" y1="225" x2="370" y2="225"/>
    <line x1="370" y1="225" x2="420" y2="225"/>
    <line x1="420" y1="225" x2="470" y2="225"/>
    <line x1="320" y1="275" x2="370" y2="275"/>
    <line x1="370" y1="275" x2="420" y2="275"/>
    <line x1="420" y1="275" x2="470" y2="275"/>
    <line x1="320" y1="175" x2="320" y2="225"/>
    <line x1="320" y1="225" x2="320" y2="275"/>
    <line x1="370" y1="175" x2="370" y2="225"/>
    <line x1="370" y1="225" x2="370" y2="275"/>
    <line x1="420" y1="175" x2="420" y2="225"/>
    <line x1="420" y1="225" x2="420" y2="275"/>
    <line x1="470" y1="175" x2="470" y2="225"/>
    <line x1="470" y1="225" x2="470" y2="275"/>
  </g>
  <!-- Glow effects -->
  <circle cx="395" cy="225" r="100" fill="#8b5cf6" opacity="0.1" filter="blur(40px)"/>
  <!-- Binary/quantum states -->
  <text x="400" y="380" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="14">|0⟩ + |1⟩ → Quantum Superposition</text>
</svg>