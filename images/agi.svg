<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- AGI Brain/Core -->
  <circle cx="200" cy="110" r="60" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Neural network pattern -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.5">
    <circle cx="180" cy="90" r="8"/>
    <circle cx="220" cy="90" r="8"/>
    <circle cx="200" cy="70" r="8"/>
    <circle cx="170" cy="120" r="8"/>
    <circle cx="200" cy="110" r="10" fill="#8b5cf6" opacity="0.3"/>
    <circle cx="230" cy="120" r="8"/>
    <circle cx="185" cy="140" r="8"/>
    <circle cx="215" cy="140" r="8"/>
    <!-- Connections -->
    <line x1="180" y1="90" x2="200" y2="70"/>
    <line x1="220" y1="90" x2="200" y2="70"/>
    <line x1="180" y1="90" x2="200" y2="110"/>
    <line x1="220" y1="90" x2="200" y2="110"/>
    <line x1="170" y1="120" x2="200" y2="110"/>
    <line x1="230" y1="120" x2="200" y2="110"/>
    <line x1="185" y1="140" x2="200" y2="110"/>
    <line x1="215" y1="140" x2="200" y2="110"/>
  </g>
  <!-- Progress bars -->
  <g transform="translate(80, 190)">
    <text x="0" y="0" fill="#71717a" font-family="system-ui" font-size="10">Language</text>
    <rect x="60" y="-8" width="100" height="8" rx="4" fill="#27272a"/>
    <rect x="60" y="-8" width="95" height="8" rx="4" fill="#8b5cf6"/>
  </g>
  <g transform="translate(80, 210)">
    <text x="0" y="0" fill="#71717a" font-family="system-ui" font-size="10">Reasoning</text>
    <rect x="60" y="-8" width="100" height="8" rx="4" fill="#27272a"/>
    <rect x="60" y="-8" width="75" height="8" rx="4" fill="#c084fc"/>
  </g>
  <g transform="translate(80, 230)">
    <text x="0" y="0" fill="#71717a" font-family="system-ui" font-size="10">Creativity</text>
    <rect x="60" y="-8" width="100" height="8" rx="4" fill="#27272a"/>
    <rect x="60" y="-8" width="60" height="8" rx="4" fill="#a78bfa"/>
  </g>
  <!-- Human comparison line -->
  <line x1="155" y1="182" x2="155" y2="232" stroke="#fef08a" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="155" y="178" text-anchor="middle" fill="#fef08a" font-family="system-ui" font-size="8" opacity="0.7">Human Level</text>
  <!-- Label -->
  <text x="200" y="35" text-anchor="middle" fill="#fafafa" font-family="system-ui" font-size="14" font-weight="600">AGI</text>
  <!-- Glow -->
  <circle cx="200" cy="110" r="70" fill="#8b5cf6" opacity="0.1" filter="blur(30px)"/>
</svg>