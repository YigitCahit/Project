<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#111113"/>
  <!-- Canvas/Frame -->
  <rect x="100" y="40" width="200" height="150" rx="5" fill="#1a1a1d" stroke="#27272a" stroke-width="2"/>
  <!-- AI-generated abstract art -->
  <g clip-path="url(#artClip)">
    <defs>
      <clipPath id="artClip">
        <rect x="105" y="45" width="190" height="140"/>
      </clipPath>
    </defs>
    <!-- Abstract shapes -->
    <circle cx="150" cy="100" r="40" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="220" cy="80" r="30" fill="#c084fc" opacity="0.5"/>
    <ellipse cx="180" cy="140" rx="50" ry="25" fill="#a78bfa" opacity="0.4"/>
    <polygon points="250,60 280,120 220,120" fill="#7c3aed" opacity="0.5"/>
    <!-- Brush strokes -->
    <path d="M120 80 Q160 60 200 90 Q240 120 280 100" stroke="#fafafa" stroke-width="3" fill="none" opacity="0.3"/>
    <path d="M130 150 Q180 130 230 160" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  <!-- AI chip indicator -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="30" height="30" rx="5" fill="#1a1a1d" stroke="#8b5cf6" stroke-width="1"/>
    <text x="15" y="20" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="10">AI</text>
  </g>
  <!-- Arrow -->
  <line x1="80" y1="115" x2="95" y2="115" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="95,110 105,115 95,120" fill="#8b5cf6"/>
  <!-- Prompt text -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="200" height="25" rx="4" fill="#1a1a1d" stroke="#27272a" stroke-width="1"/>
    <text x="10" y="17" fill="#71717a" font-family="system-ui" font-size="10">"A cosmic dreamscape..."</text>
    <text x="180" y="17" fill="#8b5cf6" font-family="system-ui" font-size="10">→</text>
  </g>
  <!-- Sparkle effects -->
  <g fill="#c084fc" opacity="0.6">
    <circle cx="320" cy="60" r="3"/>
    <circle cx="330" cy="80" r="2"/>
    <circle cx="340" cy="70" r="2"/>
  </g>
</svg>